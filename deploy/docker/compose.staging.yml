# Staging Eduson Kids в Docker: вся система одной командой.
#
#   cd deploy/docker
#   docker compose -f compose.staging.yml up -d --build     # собрать и поднять
#   docker compose -f compose.staging.yml ps                # что запущено
#   docker compose -f compose.staging.yml logs -f app       # логи приложения
#   docker compose -f compose.staging.yml down              # остановить (данные в томах остаются)
#   docker compose -f compose.staging.yml down -v           # остановить и СТЕРЕТЬ данные
#
# Открыть: https://127.0.0.1:8443 (сертификат самоподписанный — браузер предупредит).
#
# Сервисы:
#   db      — PostgreSQL 15; при первом запуске заливает seed/eduson.dump, если он есть;
#   redis   — брокер Celery и кэш (REDIS_URL); без записи на диск;
#   migrate — разово применяет миграции и завершается;
#   app     — Django + gunicorn (стартует только после успешных миграций);
#   worker  — Celery-воркер: OTP-письма входа, прогрев кэша, очередь уведомлений;
#   beat    — Celery beat: раз в минуту разгребает очередь уведомлений, дайджесты 08:00/21:00;
#   web     — nginx: фронт + прокси /api в app; единственный, кто виден снаружи;
#   bot     — Telegram-бот (long polling) — ТОЛЬКО в профиле bot, см. ниже.
#
# Уведомления преподавателям (Telegram) отправляет сам журнал через beat/worker;
# бот только отвечает на команды и сообщает журналу привязку аккаунтов.
#
# Бот: одним токеном опрашивать Telegram может только один процесс. Пока бот
# работает на сервере, локально его не поднимать; `docker compose --profile bot up -d` —
# только со своим тестовым ботом (его токен — в bot.env рядом, по образцу bot.env.example).

name: eduson-staging

# Логи контейнеров. Docker по умолчанию пишет вывод в JSON-файл БЕЗ ограничения
# размера — он растёт, пока контейнер не удалят. Ротация: не больше 3 файлов
# по 10 МБ на контейнер (≤ 30 МБ), старые удаляются автоматически.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app-common
  logging: *logging
  image: eduson-staging-app:latest
  build:
    context: ../..
    dockerfile: Dockerfile
    target: app
  env_file: .env.staging
  volumes:
    - media:/srv/media
  # Настройки при старте используют Redis (кэш), поэтому redis — обязательная
  # зависимость и для migrate, и для всех сервисов приложения.
  # YAML-слияние «<<» вложенный depends_on НЕ сливает: сервис, который задаёт
  # свой depends_on, обязан выписать полный набор условий сам.
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    logging: *logging
    image: postgres:15-alpine
    env_file: .env.staging
    environment:
      POSTGRES_DB: eduson_staging
      POSTGRES_USER: eduson
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты первого запуска: выполняются ТОЛЬКО на пустом томе pgdata.
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ./seed:/seed:ro
    # Минимальные настройки памяти под staging (по умолчанию 128 МБ буферов и 100 соединений).
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eduson -d eduson_staging && test ! -f /var/lib/postgresql/data/RESTORE_FAILED"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  redis:
    logging: *logging
    image: redis:7.4-alpine
    # Брокер Celery и кэш. Без записи на диск: очередь уведомлений живёт в
    # PostgreSQL (outbox), потеря Redis при рестарте безопасна.
    # Вытесняются ТОЛЬКО ключи с TTL (volatile-lru): кэш Django и результаты задач
    # Celery (CELERY_RESULT_EXPIRES). Очереди kombu TTL не имеют и не вытесняются
    # никогда. allkeys-lru недопустим — он выкинул бы и очереди. Если память
    # кончилась, а ключей с TTL нет, Redis вернёт ошибку записи, а не молча
    # потеряет задачи.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Запас над maxmemory 64 МБ: фрагментация памяти и буферы клиентов.
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped

  migrate:
    <<: *app-common
    command: ["python", "manage.py", "migrate", "--noinput"]
    mem_limit: 400m
    restart: "no"

  app:
    <<: *app-common
    # Полный набор условий (см. комментарий у x-app): миграции применены и Redis жив.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Production-настройки редиректят http→https; X-Forwarded-Proto говорит Django,
      # что запрос «уже https» (так делает и nginx).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health', headers={'X-Forwarded-Proto': 'https'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 400m
    cpus: 0.5
    restart: unless-stopped

  worker:
    <<: *app-common
    # Те же ключи, что юнит KOTOKOD journal-celery-worker; concurrency 1 —
    # staging делит сервер с продом KOTOKOD. interactive — коды входа (OTP).
    # Очередь default — прогревы кэша, отправка уведомлений, фоновые задачи.
    command: ["celery", "-A", "config", "worker", "--loglevel=info",
              "-Q", "interactive,default", "--concurrency=1",
              "--prefetch-multiplier=1", "--max-tasks-per-child=200"]
    # TZ=Europe/Moscow — из образа app (ENV в Dockerfile): расписание beat и даты в задачах — по МСК.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 300m
    cpus: 0.5
    restart: unless-stopped

  beat:
    <<: *app-common
    # Один beat на систему. Файл расписания — во временном каталоге контейнера
    # (не в рабочем каталоге: образ работает от непривилегированного пользователя).
    command: ["celery", "-A", "config", "beat", "--loglevel=info",
              "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  web:
    logging: *logging
    image: eduson-staging-web:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Только 127.0.0.1: staging не виден другим компьютерам в сети.
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8081:80"
    volumes:
      - media:/srv/media:ro
      - certs:/etc/nginx/certs
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped

  bot:
    logging: *logging
    image: eduson-staging-bot:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: bot
    # Одним токеном опрашивать Telegram может только один процесс. Пока бот работает
    # на сервере, локально его не поднимать; `docker compose --profile bot up -d` —
    # только со своим тестовым ботом. Вне профиля сервис не запускается и не собирается.
    profiles: ["bot"]
    env_file: bot.env
    environment:
      TZ: Europe/Moscow
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped

volumes:
  pgdata:   # данные PostgreSQL — переживают down/up, стираются только down -v
  media:    # файлы базы знаний: пишет app, читает web
  certs:    # самоподписанный сертификат nginx
