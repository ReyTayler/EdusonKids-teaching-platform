# Заголовки для проксирования в приложение — ставятся ровно один раз.
# Не подключать вместе с дистрибутивным proxy_params: он ставит те же заголовки,
# и nginx отправил бы их дважды (так ломался rate-limit на проде KOTOKOD).
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
