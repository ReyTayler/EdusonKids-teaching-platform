# nginx контейнера web на СЕРВЕРЕ: стоит за nginx сервера (тот держит TLS,
# сертификат Let's Encrypt и пароль на вход). Сюда приходит обычный HTTP с
# 127.0.0.1:8090 через сеть Docker.
#
# Реальный IP клиента и схему (https) передаёт nginx сервера в заголовках
# X-Real-IP и X-Forwarded-Proto. Доверяем им ТОЛЬКО от адресов сети Docker
# (оттуда приходит проксированное соединение) — подделать снаружи их нельзя:
# контейнер наружу не опубликован.

upstream eduson_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    set $app_root /app;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    include /etc/nginx/snippets/journal-static.conf;

    location /internal-media/ {
        internal;
        alias /srv/media/;
    }

    location /api/integrations/ {
        return 404;
    }

    location = /api/admin/knowledge/images {
        client_max_body_size 12m;
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers-server.conf;
    }
    location = /api/admin/knowledge/files {
        client_max_body_size 26m;
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers-server.conf;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers-server.conf;
    }
    location = /health {
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers-server.conf;
    }
}
