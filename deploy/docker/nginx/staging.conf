# nginx staging-контейнера Eduson Kids (кладётся в /etc/nginx/conf.d/default.conf).
#
# Отличия от локального dev-конфига (deploy/nginx/local/nginx.conf):
#   - HTTPS с самоподписанным сертификатом (его выпускает 10-self-signed-cert.sh
#     при первом старте) — production-настройки Django требуют Secure-cookie и
#     редирект на HTTPS, без TLS вход не заработает;
#   - приложение — не runserver, а контейнер app (gunicorn) по имени в сети compose;
#   - кеш браузера включён, как на проде (dev ставит no-store).
# Маршруты статики — общий сниппет проекта, тот же файл, что локально и на проде.

upstream eduson_app {
    # «app» — имя сервиса в compose: Docker сам разрешает его во внутренний IP.
    server app:8000;
}

# Порт 80 — только перенаправление на HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Корень journal_django внутри образа: на него опирается сниппет статики.
    set $app_root /app;

    server_tokens off;
    client_max_body_size 2m;

    # Заголовки безопасности (как на проде). Не добавлять add_header внутри
    # location ниже — иначе эти заголовки там молча пропадут.
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    include /etc/nginx/snippets/journal-static.conf;

    # Файлы базы знаний: Django проверяет права и отвечает X-Accel-Redirect,
    # а сами байты отдаёт nginx из общего тома.
    location /internal-media/ {
        internal;
        alias /media/;
    }

    # Служебный вход Telegram-бота снаружи закрыт (на staging бота нет).
    location /api/integrations/ {
        return 404;
    }

    location = /api/admin/knowledge/images {
        client_max_body_size 12m;
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location = /api/admin/knowledge/files {
        client_max_body_size 26m;
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
    location = /health {
        proxy_pass http://eduson_app;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
