# ============================================================================
# Локальный nginx-конфиг Eduson Kids (Windows, БЕЗ Docker) — запуск как в проде.
# ----------------------------------------------------------------------------
# Реверс-прокси перед Django: nginx раздаёт статику фронта напрямую и проксирует
# /api/* и /health на `manage.py runserver 127.0.0.1:8100`. Логику раздачи
# статики берёт из общего сниппета (deploy/nginx/snippets/journal-static.conf) —
# тот же файл подключит прод-конфиг.
#
# Порты свои, а не как у KOTOKOD (nginx :8080, сток :19876, runserver :8000):
# оба стенда живут на одной машине и должны работать одновременно. Здесь
# nginx :8180, CSP-сток :19976, runserver :8100.
#
# Запуск: deploy/nginx/local/start-local-nginx.ps1 — правки путей не требуют.
#
# Скрипт создаёт .runtime/ рядом с собой, отдаёт его nginx как префикс (-p) и
# кладёт туда paths.conf с путями ЭТОЙ машины: каталог репозитория он берёт из
# собственного расположения. Поэтому конфиг одинаков на всех машинах, и в нём
# нечего править перед первым запуском. pid-файл и логи — тоже в .runtime/,
# поэтому с nginx KOTOKOD они не пересекаются.
#
# Руками (если очень нужно) — тогда paths.conf придётся написать самому:
#   nginx -p "<repo>/deploy/nginx/local/.runtime" -c "<repo>/deploy/nginx/local/nginx.conf"
# ============================================================================

worker_processes 1;

events {
    worker_connections 256;
}

http {
    # MIME-типы заданы инлайн (не зависим от conf/mime.types установки nginx).
    # woff2/js/css критичны: без верного типа X-Content-Type-Options: nosniff
    # заставит браузер отклонить шрифт/скрипт/стиль.
    default_type application/octet-stream;
    types {
        text/html               html;
        application/javascript  js mjs;
        text/css                css;
        font/woff2              woff2;
        font/woff               woff;
        image/svg+xml           svg;
        application/json        json map webmanifest;
        image/png               png;
        image/jpeg              jpg jpeg;
        image/x-icon            ico;
        image/gif               gif;
    }

    sendfile on;
    server_tokens off;

    # Django (runserver) — обычный TCP-порт (gunicorn POSIX-only, локально не идёт).
    upstream journal_django {
        server 127.0.0.1:8100;
    }

    # --- CSP violation reporting (зеркало будущего прод-конфига) ---
    # Браузер POST'ит отчёты о нарушениях CSP на /csp-report. Чтобы записать ТЕЛО
    # отчёта в отдельный лог, запрос проксируется на no-op сервер-«сток» ниже —
    # только при proxy_pass nginx буферизует тело и заполняет $request_body.
    # $request_body в кавычках → строка лога валидный JSON; отчёт: jq '.report|fromjson'.
    log_format csp_report escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","ref":"$http_referer","ua":"$http_user_agent","report":"$request_body"}';

    # No-op сток на loopback: принимает проксированный отчёт и сразу 204.
    # Порт 19976, а не 19876: тот занят стоком nginx KOTOKOD, и второй bind()
    # уронил бы запуск, пока работает соседний стенд.
    server {
        listen 127.0.0.1:19976;
        server_name _;
        access_log off;
        location / { return 204; }
    }

    server {
        listen 127.0.0.1:8180;  # только локально: dev-стенд не виден в сети
        server_name localhost;

        # Пути машины — в paths.conf, его пишет start-local-nginx.ps1 при каждом
        # запуске (каталог репозитория он знает по своему собственному
        # расположению). Здесь их нет намеренно: конфиг лежит в git и один на
        # все машины.
        #
        # Путь относительный — nginx резолвит include от каталога САМОГО конфига
        # (не от префикса -p, как логи), то есть от deploy/nginx/local/.
        # .runtime/ в .gitignore, поэтому сгенерированный файл туда и ложится.
        # Внутри — set $app_root и include сниппета статики, общего с прод-конфигом.
        include .runtime/paths.conf;

        client_max_body_size 2m;

        # Security-заголовки на server-уровне — зеркало будущего прод-конфига.
        # ⚠️ Не дублировать add_header внутри location (затрёт эти).
        # HSTS здесь НЕТ намеренно: локаль работает по http :8180, а
        # Strict-Transport-Security браузер на http игнорирует (и применять его
        # к localhost было бы вредно). В проде HSTS обязателен — см.
        # docs/eduson/stage4-deploy-backlog.md.
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "SAMEORIGIN"     always;
        add_header Referrer-Policy           "no-referrer"    always;
        add_header X-XSS-Protection          "0"              always;
        add_header X-Permitted-Cross-Domain-Policies "none"   always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Origin-Agent-Cluster         "?1"          always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        # DEV-ONLY: не кэшировать в браузере — иначе после правок фронта браузер
        # отдаёт старый login.js/set-password.js (новые кнопки + старый JS = «клик не
        # работает»). Наследуется в static-локейшены сниппета (у них нет своего add_header).
        # В проде этого НЕТ — там ассеты кэшируются.
        add_header Cache-Control "no-store" always;
        # Reporting API: объявляем группу "csp-endpoint" → наш /csp-report.
        # Новые браузеры используют её через директиву report-to (см. CSP ниже);
        # старые откатятся на report-uri. Приёмник (/csp-report) один и тот же.
        add_header Reporting-Endpoints 'csp-endpoint="/csp-report"' always;
        # Content-Security-Policy — Report-Only (браузер логирует, не блокирует).
        # Значение то же, что унаследовано от KOTOKOD; прод-конфиг Eduson обязан
        # держать то же значение (dev/prod parity). Наследуется в snippet-локейшены.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /csp-report; report-to csp-endpoint" always;

        # --- CSP violation reports → no-op сток, тело в выделенный лог ---
        # Лог-путь относительный → резолвится под nginx-префиксом (-p), рядом с
        # access/error логами. Без add_header внутри (наследуем server-уровневые).
        # ВНИМАНИЕ: rate-limit здесь НАМЕРЕННО НЕТ (в отличие от прода). Локально
        # это dev для одного человека, а лимит глушил бы сами отчёты о
        # нарушениях, которые мы и собираем.
        location = /csp-report {
            access_log logs/csp-violations.log csp_report;
            proxy_pass http://127.0.0.1:19976;
            proxy_set_header Host $host;
            client_body_buffer_size 64k;  # = max → отчёт всегда буферизуется в память
            client_max_body_size 64k;
        }

        # --- Медиа базы знаний (apps.knowledge) ---
        # Локально KNOWLEDGE_X_ACCEL_PREFIX обычно не задан — Django отдаёт файл
        # сам через FileResponse, и эта локация не используется. Держим её для
        # параллели с проверкой прав через nginx, как в проде (X-Accel-Redirect).
        # Каталог — значение KNOWLEDGE_MEDIA_ROOT по умолчанию (journal_django/media);
        # через $app_root, а не абсолютным путём: путь машины в git не попадает.
        location /internal-media/ {
            internal;
            alias $app_root/media/;
        }

        # --- API → Django runserver ---
        # Загрузка картинок базы знаний — эндпоинт с большим телом.
        # Без этого override серверный лимит 2m режет обычный скриншот раньше,
        # чем до него доходит лимит Django (10 МБ, KNOWLEDGE_MAX_IMAGE_BYTES).
        # Точное совпадение (=) приоритетнее префиксной /api/ ниже.
        location = /api/admin/knowledge/images {
            client_max_body_size 12m;
            proxy_pass http://journal_django;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Прикрепление файла к документу. 26m = предел приложения (25 МБ,
        # KNOWLEDGE_MAX_FILE_BYTES) плюс запас на накладные расходы multipart.
        # Без этого блока запрос попадает в общую /api/ с серверным лимитом 2m,
        # и nginx отвергает файл СВОЕЙ страницей, не доходя до Django, — то есть
        # без внятного текста о том, какой предел и насколько превышен.
        location = /api/admin/knowledge/files {
            client_max_body_size 26m;
            proxy_pass http://journal_django;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Локально runserver однопоточный: 25 МБ он принимает заметно
            # дольше, чем отдаёт обычный JSON.
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://journal_django;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Health-check → Django ---
        location = /health {
            proxy_pass http://journal_django;
            proxy_set_header Host $host;
        }

        # --- Статика фронта (общий источник истины с прод-конфигом) ---
        # Сам include — в paths.conf выше: путь до сниппета тоже машинный.
    }
}
