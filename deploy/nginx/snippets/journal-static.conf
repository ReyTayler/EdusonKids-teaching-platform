# ============================================================================
# Общий источник истины: раздача статики фронтенда Eduson Kids.
# ----------------------------------------------------------------------------
# Включается ВНУТРИ server-блока (`include …/journal-static.conf;`) и опирается на
# переменную `$app_root` — каталог journal_django/, заданный включающим сервером:
#
#     set $app_root <путь к journal_django>;
#
# Локально её пишет deploy/nginx/local/start-local-nginx.ps1 в .runtime/paths.conf.
#
# Используется обоими окружениями (один файл — одни маршруты):
#   - прод:     deploy/nginx/journal-eduson.conf (появится на этапе развёртывания);
#   - локально: deploy/nginx/local/nginx.conf    (plain HTTP :8180 + TCP runserver :8100).
#
# ⚠️ ВНУТРИ этих location НЕ добавлять add_header — иначе server-уровневые
#    security-заголовки молча исчезнут в этом location (правило наследования nginx).
# ============================================================================

# --- Не отдавать sourcemap наружу (Vite собирает admin с sourcemap) и dotfiles ---
location ~ \.map$ { deny all; }
location ~ /\.    { deny all; }

# --- Общий favicon для ВСЕХ страниц системы (login / teacher / admin).
#     Браузер по умолчанию запрашивает /favicon.ico в корне сайта независимо от
#     пути страницы (/admin/, /teacher/) → одна точка покрывает все вкладки. ---
location = /favicon.ico {
    alias $app_root/frontend/favicon.ico;
}
# SVG-вариант знака (чёрный квадрат с «E»): современные браузеры берут его вместо .ico —
# чёткий на любой плотности пикселей. Тот же принцип «один адрес на все страницы».
location = /favicon.svg {
    alias $app_root/frontend/favicon.svg;
}

# --- Страница входа: / и /login → frontend/login/index.html (vanilla, не SPA) ---
location = / {
    root $app_root/frontend/login;
    try_files /index.html =404;
}
location = /login {
    root $app_root/frontend/login;
    try_files /index.html =404;
}

# --- Установка пароля по invite: /login/set-password?token=… (путь без расширения).
#     Явный точный location ДО префиксного /login/, иначе try_files ищет файл
#     'set-password' (его нет) → 404. ---
location = /login/set-password {
    root $app_root/frontend/login;
    try_files /set-password.html =404;
}

# --- Прочие активы login: /login/* → frontend/login (без SPA-fallback) ---
location /login/ {
    alias $app_root/frontend/login/;
    try_files $uri $uri/ =404;
}

# ============================================================================
# Собранные бандлы: кешировать надолго.
# ----------------------------------------------------------------------------
# Имена файлов Vite содержат хеш содержимого (index-BB017msE.js), поэтому новая
# сборка = новое имя, и устареть кеш не может. Без заголовка кеширования браузер
# ходил бы проверять свежесть каждого файла на КАЖДОМ заходе — на мобильном
# интернете это самая заметная часть задержки старта.
#
# ⚠️ Здесь НАМЕРЕННО `expires`, а не `add_header Cache-Control`: любой add_header
# внутри location молча выключает ВСЕ заголовки уровня сервера (правило
# наследования nginx). С add_header ассеты остались бы без HSTS, nosniff и
# остальной защиты. `expires` наследование не трогает и сам выставляет
# Cache-Control: max-age.
#
# Префикс длиннее, чем /teacher/ и /admin/ ниже, поэтому эти блоки выигрывают
# у них по правилу самого длинного совпадения. Регекс-локация на .map выше
# приоритетнее любых префиксов и продолжает резать sourcemap'ы.
#
# ЛОКАЛЬНО этот же сниппет включён в dev-конфиг, где на уровне сервера стоит
# `add_header Cache-Control "no-store"`. Он наследуется сюда (своего add_header
# тут нет) и складывается с заголовком от `expires` — браузер видит список
# «no-store, max-age=…» и берёт самое строгое, то есть локально кеша не будет.
# Это нужное поведение, а не недосмотр: не «чинить».
# ============================================================================
location /teacher/assets/ {
    alias $app_root/frontend/teacher-dist/assets/;
    expires 1y;
    try_files $uri =404;
}
location /admin/assets/ {
    alias $app_root/frontend/admin-dist/assets/;
    expires 1y;
    try_files $uri =404;
}

# --- Teacher SPA: /teacher и /teacher/* → frontend/teacher-dist (Vite-бандл, history-fallback) ---
location = /teacher {
    root $app_root/frontend/teacher-dist;
    try_files /index.html =404;
}
location /teacher/ {
    alias $app_root/frontend/teacher-dist/;
    try_files $uri $uri/ /teacher/index.html;
}

# --- Admin SPA: /admin и /admin/* → frontend/admin-dist (history-fallback) ---
location = /admin {
    root $app_root/frontend/admin-dist;
    try_files /index.html =404;
}
location /admin/ {
    alias $app_root/frontend/admin-dist/;
    # Fallback-URI /admin/index.html переразрешается через ЭТОТ же alias-блок
    # → $app_root/frontend/admin-dist/index.html (файл есть → отдаётся, без цикла).
    try_files $uri $uri/ /admin/index.html;
}

# --- Корневые шрифты: /fonts/* → frontend/fonts (нужны teacher/login) ---
location /fonts/ {
    alias $app_root/frontend/fonts/;
    # Имена шрифтов несут версию (inter-v20-…), меняются только вместе с именем —
    # кешируем надолго. 30 дней, а не год: имя версионировано слабее, чем хеш
    # содержимого у бандлов.
    expires 30d;
    try_files $uri =404;
}
